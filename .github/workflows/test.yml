name: Lint
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --all-extras --frozen --no-install-project
    - name: Run linters
      run: make lint
